<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Moviestreams – All Categories</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">
          <i class="fas fa-film"></i>
        </div>
        <div class="logo-text">Movie<span>streams</span></div>
      </div>

      <div class="nav-links">
        <a href="#">Home</a>
        <a href="#">Movies</a>
        <a href="#">Series</a>
        <a href="#">New & Popular</a>
        <a href="#">My List</a>
      </div>

      <div class="user-profile">
        <i class="fas fa-search"></i>
        <i class="fas fa-bell"></i>
        <div class="avatar">JD</div>
      </div>
    </header>

    <!-- Category chips -->
    <div class="category-bar" id="categoryBar">
      <!-- Rendered via JavaScript -->
    </div>

    <!-- Continue Watching section -->
    <div class="section-title">
      <h2>Continue watching</h2>
      <a href="#" class="view-all">See all <i class="fas fa-chevron-right"></i></a>
    </div>

    <div class="continue-scroll" id="continueScroll">
      <!-- Rendered via JavaScript -->
    </div>

    <!-- Trending Now -->
    <div class="section-title">
      <h2>Trending across categories</h2>
      <a href="#" class="view-all">View all <i class="fas fa-chevron-right"></i></a>
    </div>

    <div class="movie-grid" id="trendingGrid">
      <!-- Rendered via JavaScript -->
    </div>

    <!-- New Releases -->
    <div class="section-title">
      <h2>New releases · all genres</h2>
      <a href="#" class="view-all">Browse all <i class="fas fa-chevron-right"></i></a>
    </div>

    <div class="movie-grid" id="newReleasesGrid">
      <!-- Rendered via JavaScript -->
    </div>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer-links">
        <a href="#">About</a>
        <a href="#">Help Center</a>
        <a href="#">Terms</a>
        <a href="#">Privacy</a>
        <a href="#">Jobs</a>
      </div>
      <div class="socials">
        <i class="fab fa-twitter"></i>
        <i class="fab fa-instagram"></i>
        <i class="fab fa-youtube"></i>
        <i class="fab fa-facebook"></i>
      </div>
      <div style="font-size:0.8rem;">© 2025 Moviestreams – All rights reserved.</div>
    </footer>
  </div>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
